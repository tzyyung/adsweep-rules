name: Update Domain Blocklist

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  update-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and convert domain lists
        run: python scripts/update_domains.py domains/adsweep_domains.txt

      - name: Update index.json domain count
        run: |
          COUNT=$(grep -v '^#' domains/adsweep_domains.txt | grep -c '.')
          python -c "
          import json
          with open('index.json') as f:
              idx = json.load(f)
          idx['domains']['count'] = $COUNT
          idx['updated'] = '$(date +%Y-%m-%d)'
          with open('index.json', 'w') as f:
              json.dump(idx, f, indent=2)
              f.write('\n')
          "

      - name: Check for changes
        id: diff
        run: |
          git diff --stat
          echo "changed=$(git diff --quiet && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domains/adsweep_domains.txt index.json
          COUNT=$(grep -v '^#' domains/adsweep_domains.txt | grep -c '.')
          git commit -m "Update domain blocklist ($COUNT domains)"
          git push
